<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeMe™ – Wear a SeMe Apron</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <!-- Google Fonts: Playfair Display (serif, matches logo style) + Inter -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ── Logo ── */
    .navbar-brand .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -1px;
      color: #111;
      line-height: 1;
    }
    .navbar-brand .logo-tm {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      vertical-align: super;
      color: #111;
    }

    /* ── Navbar ── */
    .site-navbar {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      padding: 0.75rem 2rem;
    }

    /* ── Search bar ── */
    .search-wrapper {
      position: relative;
      max-width: 320px;
      width: 100%;
    }
    .search-wrapper .bi-search {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      font-size: 1rem;
    }
    .search-wrapper input {
      background: #f3f3f3;
      border: none;
      border-radius: 50px;
      padding: 0.45rem 1rem 0.45rem 2.4rem;
      font-size: 0.9rem;
      color: #555;
      width: 100%;
    }
    .search-wrapper input:focus {
      outline: none;
      background: #ebebeb;
    }

    /* ── Nav icons ── */
    .nav-icons a {
      color: #111;
      font-size: 1.4rem;
      text-decoration: none;
      line-height: 1;
    }
    .nav-icons a:hover {
      color: #e91e8c;
    }

    /* ── Hero ── */
    .hero-section {
      position: relative;
      min-height: 520px;
      background: url('https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1600&q=80')
        center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* dark overlay for text legibility */
    .hero-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.32);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1rem;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 0.2rem;
    }
    .hero-title .brand-inline {
      font-style: italic;
    }

    /* Pink underline accent */
    .hero-accent-bar {
      display: block;
      width: 60px;
      height: 3px;
      background: #e91e8c;
      margin: 0.5rem auto 0.9rem;
      border-radius: 2px;
    }

    .hero-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 2rem;
    }

    /* ── Hero buttons ── */
    .btn-shop {
      background: #e91e8c;
      color: #fff;
      border: 2px solid #e91e8c;
      border-radius: 50px;
      padding: 0.55rem 2.4rem;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s, color 0.2s;
    }
    .btn-shop:hover {
      background: #c5197a;
      border-color: #c5197a;
      color: #fff;
    }

    .btn-subscribe {
      background: #fff;
      color: #111;
      border: 2px solid #fff;
      border-radius: 50px;
      padding: 0.55rem 2.2rem;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s, color 0.2s;
    }
    .btn-subscribe:hover {
      background: rgba(255, 255, 255, 0.85);
      color: #111;
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════
       NAVBAR
  ══════════════════════════════════ -->
  <nav class="navbar site-navbar">
    <div class="container-fluid d-flex align-items-center gap-3">

      <!-- Logo -->
      <a class="navbar-brand me-auto" href="#">
        <span class="logo-text">SeMe<span class="logo-tm">™</span></span>
      </a>

      <!-- Search -->
      <div class="search-wrapper d-none d-md-block">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Search for a product..." />
      </div>

      <!-- Icons -->
      <div class="nav-icons d-flex align-items-center gap-3 ms-auto ms-md-3">
        <a href="#" aria-label="Wishlist"><i class="bi bi-heart"></i></a>
        <a href="#" aria-label="Cart"><i class="bi bi-bag"></i></a>
        <a href="#" aria-label="Menu"><i class="bi bi-list"></i></a>
      </div>

    </div>
  </nav>

  <!-- ══════════════════════════════════
       HERO
  ══════════════════════════════════ -->
  <section class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">
        Wear a <span class="brand-inline">SeMe</span> Apron
      </h1>
      <span class="hero-accent-bar"></span>
      <p class="hero-subtitle">Don't Hide Your Style</p>
      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="#" class="btn btn-shop">Shop</a>
        <a href="#" class="btn btn-subscribe">Subscribe</a>
      </div>
    </div>
  </section>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
